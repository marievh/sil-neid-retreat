<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>NEID Global Retreat · Agenda</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23F4552A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#F4552A; --teal:#007C7C; --deep:#0B3441; --yellow:#E4D22E;
  --bg:#FFFFFF; --panel:#F7EAE5; --card:#FFFFFF; --ink:#16282E; --muted:#56676C; --line:#E3D3CC; --col:#FBF5F2; --focus:#0B3441; --blush:#F7EAE5; --pool:#DDF0EF; --poolline:#6FB3B3;
  --display:"Josefin Sans","Avenir Next","Century Gothic",system-ui,sans-serif;
  --body:"Nunito Sans","Avenir","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0A242D; --panel:#0F313C; --card:#123B47; --ink:#EEF3F2; --muted:#A9BCC0; --line:#24505C; --col:#0D2C36; --focus:#E4D22E; --blush:#2A3F45; --pool:#0E3D40; --poolline:#2F8080; }}
:root[data-theme="dark"]{ --bg:#0A242D; --panel:#0F313C; --card:#123B47; --ink:#EEF3F2; --muted:#A9BCC0; --line:#24505C; --col:#0D2C36; --focus:#E4D22E; --blush:#2A3F45; --pool:#0E3D40; --poolline:#2F8080; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.weave{height:18px;background:
  repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.35) 6px 8px),
  repeating-linear-gradient(90deg,var(--orange) 0 38px,var(--yellow) 38px 44px,var(--orange) 44px 70px,var(--teal) 70px 78px,var(--orange) 78px 120px,#F7EAE5 120px 124px)}
.btn{border:1.5px solid currentColor;background:transparent;border-radius:999px;padding:7px 16px;font-weight:700;cursor:pointer}
.btn.solid{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.quiet{border-color:var(--line)}
.btn:disabled{opacity:.6;cursor:default}

/* App */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px clamp(16px,4vw,40px)}
.top h1{margin:0;font:700 clamp(24px,3.5vw,32px)/1.1 var(--display);color:var(--orange)}
.top small{display:block;font:700 13px/1.2 var(--display);letter-spacing:.06em;color:var(--teal);margin-bottom:4px}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:12px}
.bar{background:var(--teal);display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px clamp(16px,4vw,40px)}
.tabs{display:flex;gap:8px;overflow-x:auto;max-width:100%}
.tab{border:0;border-radius:2px;background:#D8ECEB;color:var(--deep);padding:8px 16px;font:700 15px/1 var(--display);letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--yellow)}
.tab{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px 16px}
.tab .badge{margin-left:0;font-size:12px}
.badge{display:inline-block;margin-left:8px;min-width:22px;padding:2px 6px;border-radius:999px;background:var(--orange);color:#fff;font:700 12px/1.2 var(--body)}
.badge.done{background:var(--deep)}
.search{flex:1 1 200px;max-width:320px;margin-left:auto;border:0;border-radius:2px;padding:9px 12px;background:#fff;color:#16282E}
main{padding:20px clamp(16px,4vw,40px) 60px}
.loading{color:var(--muted);font-weight:600;margin:0 0 16px}
.board{display:grid;grid-template-columns:minmax(260px,320px) 1fr;gap:20px;align-items:start}
.sessions{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.col{background:var(--col);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;min-width:0}
.col.pool{background:var(--pool);border:2px dashed var(--poolline);position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.col-head{padding:14px 14px 10px;border-top:6px solid var(--stripe,var(--teal));border-radius:4px 4px 0 0}
.col-head h2{margin:0;font:700 19px/1.2 var(--display);padding-right:28px}
.col:not(.pool) .col-head{position:relative;cursor:grab}
.grip{position:absolute;top:12px;right:12px;font-size:18px;line-height:1;color:var(--muted);letter-spacing:-2px;user-select:none}
.sessions .sortable-ghost{opacity:.4}
.col-head p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.col-head .btn{margin-top:8px;font-size:13px;padding:4px 12px}
.list{list-style:none;margin:0;padding:6px 10px 12px;display:flex;flex-direction:column;gap:6px;min-height:64px;flex:1}
.empty{font-size:13px;color:var(--muted);padding:8px 4px;font-style:italic}
.add-col{border:2px dashed var(--line);border-radius:4px;background:transparent;min-height:120px;cursor:pointer;color:var(--muted);font-weight:700}
.card{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:9px 10px;cursor:grab}
.card.dim{opacity:.28} .card.hit{box-shadow:0 0 0 2px var(--orange)}
.who{min-width:0;flex:1}
.who b{display:block;font-size:14.5px;line-height:1.25}
.who .org{display:block;font-size:12.5px;font-weight:600;color:var(--teal)}
.who .bio{display:block;margin-top:4px;font-size:13px;line-height:1.45;color:var(--muted)}
.who .focus{display:block;margin-top:6px;font-size:12.5px;line-height:1.4;color:var(--ink)}
.who .focus b{display:block;font-size:12.5px;color:var(--teal)}
.who .fi{display:block;padding-left:14px;text-indent:-10px}
.who .fi::before{content:"•";display:inline-block;width:10px;text-indent:0;color:var(--teal)}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.fac{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:700;background:var(--yellow);color:#16282E;border-radius:2px;padding:1px 6px}
.tools{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.star{border:0;background:transparent;font-size:18px;line-height:1;cursor:pointer;color:var(--muted);padding:4px}
.star[aria-pressed="true"]{color:var(--orange)}
.pen{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:12px;font-weight:700;padding:4px;text-decoration:underline}
.sortable-ghost{opacity:.35}
.details{display:block;margin-top:8px;padding:8px 10px;background:var(--blush);border-radius:3px;font-size:12.5px;line-height:1.45}
.details .dl{display:block;font-weight:700;color:var(--deep);margin-top:6px}
.details .dl:first-child{margin-top:0}
.details .para{display:block;white-space:pre-line}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tagchip{border:1px solid var(--teal);background:transparent;color:var(--teal);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;cursor:pointer}
.tagchip[aria-pressed="true"]{background:var(--teal);color:#fff}
.tagbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 16px}
.tagbar .lbl{font-weight:700;font-size:13.5px;margin-right:4px}
.tagbar .tagchip{font-size:12.5px;padding:3px 10px}
.tagbar .tagchip small{font-weight:600;opacity:.75}
.switch{border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;background:transparent;cursor:pointer;font-weight:700}
.switch[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.errline{color:#B3261E;font-size:13.5px;min-height:1.4em;margin:8px 0 0}

dialog{border:0;border-radius:6px;padding:0;max-width:min(560px,calc(100vw - 32px));width:100%;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(11,52,65,.55)}
.dlg{padding:24px}
.dlg h3{margin:0 0 12px;font:700 24px/1.15 var(--display);color:var(--orange)}
.dlg label{display:block;font-weight:700;font-size:13px;margin:12px 0 4px}
.dlg input,.dlg textarea{width:100%;border:1px solid var(--line);border-radius:3px;padding:8px 10px;background:var(--card)}
.dlg textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}
.row .left{margin-right:auto}
.danger{color:#B3261E}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1}
@media (max-width:760px){ .board{grid-template-columns:1fr} .col.pool{position:static;max-height:none} .search{max-width:none;margin-left:0} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Version 2 ---------- */
.gate{max-width:440px;margin:12vh auto 0;padding:0 20px}
.gate small{display:block;font:700 14px/1.2 var(--display);letter-spacing:.06em;color:var(--teal)}
.gate h1{margin:8px 0 8px;font:700 34px/1.1 var(--display);color:var(--orange)}
.gate p{color:var(--muted);margin:0 0 20px}
.gate label{display:block;font-weight:700;margin-bottom:6px}
.gate input{width:100%;border:1px solid var(--line);border-radius:3px;padding:10px 12px;background:var(--card);margin-bottom:12px;font-size:16px}
.gate .btn{width:100%;padding:10px}
.role{display:inline-block;font:700 11.5px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--deep);color:#fff;border-radius:999px;padding:5px 10px}
.tab.home{justify-content:center}
/* Agenda */
.agenda{max-width:980px}
.day{margin:0 0 36px}
.day h2{margin:0;font:700 clamp(23px,3.2vw,28px)/1.15 var(--display);color:var(--orange)}
.day .q{margin:6px 0 14px;font:700 16.5px/1.4 var(--display);color:var(--teal);max-width:62ch}
.items{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:165px 1fr;gap:4px 18px;padding:14px 0;border-bottom:1px solid var(--line)}
.item .t{font-weight:700;font-size:14px;color:var(--muted);padding-top:2px;white-space:nowrap}
.item h3{margin:0;font:700 17.5px/1.3 var(--display)}
.item .room{font-size:13px;color:var(--teal);font-weight:700;margin-top:2px}
.item .desc{margin-top:6px;font-size:14px}
.item .desc p{margin:4px 0 0}
.item .desc ul{margin:4px 0 0;padding-left:20px}
.item .desc li{margin:2px 0}
.item.minor h3{font:600 15.5px/1.3 var(--body);color:var(--muted)}
.you{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:700;background:var(--teal);color:#fff;border-radius:2px;padding:2px 8px}
@media (max-width:640px){ .item{grid-template-columns:1fr} .item .t{padding:0} }
@media print{ .bar,.status{display:none!important} body{background:#fff;color:#000} }

/* ---------- Single-page agenda (mobile first) ---------- */
.bar{position:sticky;top:0;z-index:5;padding-top:calc(10px + env(safe-area-inset-top,0px))}
.days{display:flex;gap:8px;overflow-x:auto}
.dayjump{border:0;border-radius:999px;background:#D8ECEB;color:var(--deep);padding:8px 16px;font:700 14px/1 var(--display);letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.dayjump:active{background:var(--yellow)}
html{scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
.find{background:var(--pool);border:2px solid var(--poolline);border-radius:10px;padding:16px 16px 14px;margin:14px 0 30px}
.find .hi{display:block;margin:0;font:700 22px/1.2 var(--display);color:var(--deep)}
:root[data-theme="dark"] .find .hi{color:var(--ink)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .find .hi{color:var(--ink)} }
.lbl2{margin:4px 0 10px;color:var(--muted);font-size:14px}
.find input{width:100%;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:16px;background:var(--card);color:var(--ink)}
.matches{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.match{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 12px;cursor:pointer}
.match b{font-size:15.5px} .match span{font-size:13px;color:var(--muted)}
.mychips{display:flex;flex-direction:column;gap:8px}
.mychip{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:0;border-left:5px solid var(--teal);background:var(--card);border-radius:8px;padding:10px 12px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.mychip .w{font-size:12.5px;font-weight:700;color:var(--teal);text-transform:uppercase;letter-spacing:.05em}
.mychip .t{font:700 15.5px/1.3 var(--display)}
.mychip.talkchip{border-left-color:var(--orange)}
.mychip.talkchip .w{color:var(--orange)}
.mychip .fac{margin-top:4px}
.linkbtn{border:0;background:transparent;color:var(--teal);font-weight:700;text-decoration:underline;cursor:pointer;padding:8px 0 0;font-size:14px}
.groups{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.group{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.group.mine{border:2px solid var(--teal)}
.ghead{display:grid;grid-template-columns:1fr auto;gap:2px 10px;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;cursor:pointer;color:inherit}
.ghead .here{grid-column:1/-1;justify-self:start;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--teal);color:#fff;border-radius:999px;padding:3px 9px;margin-bottom:4px}
.ghead .gt{font:700 15.5px/1.3 var(--display)}
.ghead .gm{grid-column:1;font-size:13px;color:var(--muted)}
.ghead .chev{grid-column:2;grid-row:2/4;align-self:center;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
.group.mine .ghead .chev{grid-row:2/4}
.group.open .ghead .chev{transform:rotate(-135deg)}
.gbody{padding:0 14px 12px}
.gdesc{margin:0 0 10px;font-size:14px;color:var(--muted)}
.people{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.people li{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.people li:first-child{border-top:0}
.people b{display:block;font-size:14.5px}
.people .sub{display:block;font-size:12.5px;color:var(--muted)}
.people .fac{margin-left:auto}
.people li.isme b{color:var(--teal)}
.item .t .loc{display:block;margin-top:3px;font-size:12.5px;font-weight:700;color:var(--teal);white-space:normal}
.item .desc li.talk{margin:8px 0}
.item .desc li.talk .tt{display:block}
.item .desc li.talk .by{display:block;font-size:13px;color:var(--teal)}
.item .desc li.mytalk{background:var(--pool);border-radius:6px;padding:6px 8px}
.item .desc li.mytalk .you{margin-top:4px}
.status span:empty{display:none}
.item.brk{background:transparent;border:0;border-left:0;padding:16px 0;margin:0;border-bottom:1px solid var(--line);border-radius:0}
.item.me .c > h3::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--teal);margin-right:8px;vertical-align:middle}
@media (max-width:640px){
  .top{padding:12px 16px;flex-wrap:nowrap;align-items:flex-start}
  .top h1{font-size:21px}
  .day h2{font-size:22px}
  .day .q{font-size:15.5px}
  .item{gap:2px;padding:14px 0}
  .item .t{font-size:13px}
  main{padding:16px 16px 60px}
  .status .btn{padding:5px 12px;font-size:13px}
}

/* ---------- NEID look: orange header, woven backdrop, stat-card "find yourself", yellow buttons ---------- */
.top{background:var(--orange);color:#fff}
.top small{color:#FBE7A1;letter-spacing:.12em;text-transform:uppercase;font-size:12.5px}
.top h1{color:#fff;font-size:clamp(34px,6vw,46px);margin-top:6px}
.top h1 .hl{background:var(--teal);padding:0 .18em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.top .status{color:#fff}
.top .btn.quiet{border-color:rgba(255,255,255,.8);color:#fff}
.top .role{background:#fff;color:var(--orange)}
.findwrap{margin:18px 0 30px;padding:22px 16px;border-radius:6px;
  background:
    repeating-linear-gradient(90deg,transparent 0 9px,rgba(255,255,255,.18) 9px 11px,transparent 11px 23px,rgba(11,52,65,.12) 23px 25px),
    repeating-linear-gradient(90deg,#F4552A 0 46px,#F26A3C 46px 52px,#F4552A 52px 88px,#E4D22E 88px 91px,#F4552A 91px 140px,#0E8A88 140px 144px)}
.find{margin:0;max-width:560px;margin-inline:auto;background:#F7EAE5;color:#16282E;border:6px solid #fff;border-radius:2px;box-shadow:0 6px 18px rgba(0,0,0,.18);padding:18px 18px 16px}
.find .hi{color:#16282E!important;font-size:24px}
.find .lbl2{color:#56676C}
.find input{background:#fff;color:#16282E;border-color:#E3D3CC}
.find .linkbtn{color:#0B6E6E}
.match{background:var(--yellow);border:0;color:#16282E;border-radius:2px;padding:11px 14px}
.match b{letter-spacing:.02em}
.match span{color:#3F4A3C}
.mychip{background:#fff;color:#16282E}
.gate .btn.solid{background:var(--yellow);border-color:var(--yellow);color:#16282E;letter-spacing:.06em}
@media (max-width:640px){
  .top h1{font-size:34px}
  .findwrap{margin:-16px -16px 26px;border-radius:0;padding:20px 14px}
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .day .q, :root:not([data-theme="light"]) .item .t .loc, :root:not([data-theme="light"]) .item .room{color:#5CC4C2} }
:root[data-theme="dark"] .day .q, :root[data-theme="dark"] .item .t .loc, :root[data-theme="dark"] .item .room{color:#5CC4C2}

/* ---------- Type system: two fonts, one label style, a small set of sizes ----------
   Josefin Sans (display) only for the page title and the day headings.
   Nunito Sans (body) for everything else. Small uppercase labels all share .label styling. */
.tab,.dayjump,.btn,.switch,.find .hi,.mychip .t,.ghead .gt,.item h3,.item.minor h3,.day .q,
.col-head h2,.dlg h3,.role,.badge,.match,.tagchip,.fac,.you{font-family:var(--body)}
.top h1,.gate h1,.day h2{font-family:var(--display);letter-spacing:.01em}
/* Labels: one style everywhere */
.top small,.gate small,.mychip .w,.ghead .here,.role,.fac,.you{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;line-height:1.2}
.fac,.you{padding:3px 8px}
/* Sizes */
.find .hi{font-size:22px;font-weight:800}
.lbl2{font-size:14px}
.match b{font-size:16px;font-weight:700;letter-spacing:0}
.match span{font-size:13px}
.mychip .t,.ghead .gt{font-size:16px;font-weight:700;line-height:1.3}
.day h2{font-size:clamp(24px,3.4vw,30px);font-weight:700}
.day .q{font-size:16px;font-weight:700;line-height:1.4}
.item h3{font-size:17px;font-weight:700;line-height:1.3}
.item.minor h3{font-size:15px;font-weight:600}
.item .t{font-size:13px;font-weight:700}
.item .t .loc,.item .room{font-size:13px;font-weight:600}
.item .desc{font-size:15px}
.item .desc li.talk .by{font-size:13px;font-weight:700}
.ghead .gm,.people .sub{font-size:13px}
.people b{font-size:15px;font-weight:700}
.gdesc{font-size:14px}
.dayjump,.tab{font-size:14px;font-weight:700;letter-spacing:.02em}
@media (max-width:640px){ .day h2{font-size:24px} .day .q{font-size:15px} }

/* ---------- Footer and logo ---------- */
.foot{margin-top:24px;background:#0B3441;color:#fff}
.foot-in{display:flex;flex-wrap:wrap;align-items:center;gap:18px 28px;padding:26px clamp(16px,4vw,40px) calc(30px + env(safe-area-inset-bottom,0px))}
.foot p{margin:0;max-width:52ch;font-size:14px;line-height:1.5;color:#D8ECEB}
.foot a{color:#fff;font-weight:700}
.logo-chip{display:inline-block;background:#fff;border-radius:8px;padding:10px 14px;line-height:0}
.logo-chip img{display:block;width:190px;height:auto}
.gate-logo{margin:0 0 18px;padding:8px 12px}
.gate-logo img{width:170px}

/* ---------- Gold = yours: everything about the person who found themselves ---------- */
:root{--gold:#E4D22E;--goldtint:#FBF4C9;--goldink:#6E5F00}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--goldtint:#3A3413;--goldink:#E4D22E} }
:root[data-theme="dark"]{--goldtint:#3A3413;--goldink:#E4D22E}
.you{background:var(--gold);color:#16282E}
.mychip{border-left:6px solid var(--gold)}
.mychip .w,.mychip.talkchip .w{color:#6E5F00}
.mychip.talkchip{border-left-color:var(--gold)}
.group.mine{border:2px solid var(--gold);background:var(--goldtint)}
.ghead .here{background:var(--gold);color:#16282E}
.item.me .c > h3::before{background:var(--gold);width:10px;height:10px}
.item .desc li.mytalk{background:var(--goldtint)}
.people li.isme b{color:inherit}
.people li.isme{background:var(--goldtint);border-radius:6px;padding-left:6px;padding-right:6px}
.group.mine .people li.isme{background:rgba(228,210,46,.35)}
/* Other people's facilitator tags stay quiet, so gold always means "you" */
.people .fac{background:transparent;color:var(--muted);border:1px solid var(--line)}
.people li.isme .fac{background:var(--gold);color:#16282E;border-color:var(--gold)}
/* Tighter "Hi" card */
.findwrap{padding:12px 12px}
.find{border-width:4px;padding:14px 14px 12px}
.find .hi{font-size:21px}
.find .lbl2{margin:2px 0 8px}
.mychips{gap:6px}
.mychip{padding:8px 12px}
.find .linkbtn{padding-top:6px}
@media (max-width:640px){ .findwrap{margin:-16px -16px 20px;padding:10px 10px} }

/* ---------- Centered column + "Hi" card on the teal band ---------- */
:root{--col-w:760px;--pad:clamp(16px,4vw,40px)}
body{overflow-x:clip}
.top,.bar,.foot-in{padding-left:max(var(--pad), calc((100% - var(--col-w)) / 2));padding-right:max(var(--pad), calc((100% - var(--col-w)) / 2))}
.agenda{max-width:var(--col-w);margin-inline:auto}
.findwrap{background:var(--teal);border-radius:0;
  margin:-20px calc(50% - 50vw) 28px;padding:4px max(var(--pad), calc((100vw - var(--col-w)) / 2)) 22px}
.find{max-width:none;margin:0}
@media (max-width:640px){ .findwrap{margin:-16px calc(50% - 50vw) 22px;padding:2px 10px 14px} }

/* ---------- Footer: logos in a row, sentence on one line ---------- */
.foot-in{flex-direction:column;align-items:flex-start;gap:16px}
.logos{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sil-logo{display:inline-block;line-height:0}
.sil-logo img{width:77px;height:77px;display:block}
.foot p{max-width:none}
/* ---------- Square corners, like NEID's website ---------- */
.btn,.dayjump,.tab,.switch,.match,.mychip,.linkbtn,.ghead,.tagchip,.badge,.role,.you,.fac,.ghead .here,
.find,.find input,.group,.logo-chip,.findwrap,.gate input,.dlg input,.dlg textarea,dialog,.item .desc li.mytalk,.people li.isme,.card,.col,.search,.toast{border-radius:0}

/* ---------- Hover: buttons turn light gold (only on devices with a mouse) ---------- */
:root{--hovergold:#F8EBA0}
.btn,.dayjump,.tab,.switch,.match,.mychip,.ghead,.tagchip,.gate .btn.solid{transition:background-color .15s,color .15s,border-color .15s}
@media (hover:hover){
  .btn:hover,.dayjump:hover,.tab:hover,.switch:hover,.match:hover,.mychip:hover,.tagchip:hover,.gate .btn.solid:hover{background:var(--hovergold);color:#16282E;border-color:var(--hovergold)}
  .ghead:hover{background:var(--hovergold);color:#16282E}
  .ghead:hover .gm{color:#3F4A3C}
  .mychip:hover .w{color:#6E5F00}
  .top .btn.quiet:hover{border-color:var(--hovergold)}
  .linkbtn:hover{color:#16282E;background:var(--hovergold)}
}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
/* ---------- Config ----------
   API_URL: your Apps Script web app URL (ends in /exec).
   Attendees sign in with the shared attendee code; admins with the admin password.
   Both live in Apps Script (Script Properties), never in this file. */
const CONFIG = { API_URL: "https://script.google.com/macros/s/AKfycbyOLTmLxS4Dg1-HI7ot2e5oKh38WYtxrgSgp6OgfaqH9xbJw8CI_BP7ONZmswUu-vHn/exec", REFRESH_SECONDS: 30, DEMO_CODES: {} };
const DEMO = null;   // preview only; the live site gets everything from Apps Script

const CODE_KEY = "neid-v2-code", CACHE_KEY = "neid-v2-cache", ME_KEY = "neid-v2-me";
const STRIPES = ["var(--orange)"];
let state = null, role = "", view = "agenda", round = null, query = "", me = "";
let profiles = null, showDetails = true, activeTag = "";
let sortables = [], dragging = false, inFlight = 0, saving = Promise.resolve();

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = (k, v) => { try { v ? localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v)) : localStorage.removeItem(k); } catch(e){} };
const load = k => { try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } };
const norm = t => String(t||"").normalize("NFKD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const isAdmin = () => role === "admin";
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
function setStatus(t){ $("#saveStatus").textContent = t; }

/* ---------- Talking to the Google Sheet ---------- */
// Requests are POSTs sent as text/plain, which avoids a CORS preflight. They give up after 25 seconds.
async function call(body){
  if (!CONFIG.API_URL) return demoCall(body);
  const ctrl = new AbortController(), timer = setTimeout(()=>ctrl.abort(), 25000);
  let r;
  try { r = await fetch(CONFIG.API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(body), signal: ctrl.signal}); }
  catch(e){ clearTimeout(timer); return {ok:false, error: e.name==="AbortError" ? "timeout" : "unreachable"}; }
  try { return await r.json(); } catch(e){ return {ok:false, error: e.name==="AbortError" ? "timeout" : "not_json"}; }
  finally { clearTimeout(timer); }
}
// Preview mode only (no API_URL): pretends to be Apps Script, using the demo data in this page.
function demoCall(body){
  if (!DEMO) return {ok:false, error:"no_url"};
  const c = String(body.code||"").trim();
  const r = c === CONFIG.DEMO_CODES.admin ? "admin" : (c.toLowerCase() === CONFIG.DEMO_CODES.attendee ? "attendee" : "");
  if (!r) return {ok:false, error:"bad_code"};
  if (body.action === "login" || body.action === "load"){
    const s = structuredClone(DEMO.state);
    if (r !== "admin") s.people = s.people.map(p=>({id:p.id, name:p.name, title:p.title, org:p.org}));
    return {ok:true, role:r, state:s};
  }
  if (r !== "admin") return {ok:false, error:"admin_only"};
  if (body.action === "profiles") return {ok:true, profiles: structuredClone(DEMO.profiles)};
  if (body.action === "save"){ DEMO.state = structuredClone(body.state); DEMO.state.rev = (body.rev||0)+1; return {ok:true, rev: DEMO.state.rev}; }
  if (body.action === "saveProfile"){ DEMO.profiles[body.person_id] = body.profile; return {ok:true}; }
  return {ok:false, error:"unknown_action"};
}
const ERRORS = {
  bad_code: "That code didn't match our records. Please check the code and try again.",
  no_password_set: "The site isn't set up yet: no codes are set in Apps Script (Script Properties).",
  no_url: "This page isn't connected to the Google Sheet yet. Paste the Apps Script web app URL into API_URL in index.html.",
  unreachable: "Couldn't reach the server. Check your connection and try again.",
  timeout: "The server took too long to respond. Please try again in a minute.",
  not_json: "The server didn't answer as expected. If you just updated the site, do a hard refresh (Cmd+Shift+R or Ctrl+Shift+R)."
};

/* ---------- Sign in and out ---------- */
async function signIn(code){
  $("#goBtn").disabled = true; $("#gateErr").textContent = "Checking… this can take a few seconds.";
  const j = await call({action:"login", code: code.trim()});
  $("#goBtn").disabled = false;
  if (!j.ok){
    if (j.error === "bad_code"){ store(CODE_KEY, ""); store(CACHE_KEY, ""); }
    showGate(ERRORS[j.error] || "Something went wrong. Try again.");
    return false;
  }
  store(CODE_KEY, code.trim()); role = j.role;
  showApp(j.state);
  if (isAdmin()) loadProfiles();
  return true;
}
function showGate(msg){
  state = null; role = ""; profiles = null;
  $("#app").hidden = true; $("#gate").hidden = false; $("#gateWeave").hidden = false;
  $("#gateErr").textContent = msg || ""; $("#code").focus();
}
function signOut(){ store(CODE_KEY, ""); store(CACHE_KEY, ""); $("#code").value = ""; showGate(""); }
$("#gate").addEventListener("submit", e=>{ e.preventDefault(); signIn($("#code").value); });
$("#outBtn").onclick = signOut;

function showApp(s){
  state = s; store(CACHE_KEY, {role, state: s});
  if (!round || !s.rounds.some(r=>r.id===round)) round = s.rounds[0]?.id || null;
  if (me && !s.people.some(p=>p.id===me)) me = "";
  $("#gate").hidden = true; $("#gateWeave").hidden = true; $("#app").hidden = false; $("#loading").hidden = true;
  render();
}
async function loadProfiles(){
  const j = await call({action:"profiles", code: load(CODE_KEY)});
  if (j.ok){ profiles = j.profiles; render(); }
}

/* ---------- Saving (admins only) ---------- */
function save(){
  if (!isAdmin()) return;
  inFlight++; setStatus("Saving…");
  saving = saving.then(async ()=>{
    const j = await call({action:"save", code: load(CODE_KEY), rev: state.rev, state});
    if (j.ok){ state.rev = j.rev; store(CACHE_KEY, {role, state}); setStatus("All changes saved"); }
    else if (j.conflict){ state = j.state; render(); setStatus("All changes saved"); toast("Someone else just made changes, so the board refreshed. Please redo your last change."); }
    else if (j.error === "bad_code" || j.error === "admin_only"){ setStatus("Not saved"); toast("Your admin login is no longer valid. Log out and sign in again."); }
    else { setStatus("Not saved"); toast("Couldn't save. Check your connection and try again."); }
    inFlight--;
  });
}
async function refresh(){
  if (!CONFIG.API_URL || !state || document.hidden || dragging || inFlight || document.querySelector("dialog[open]")) return;
  const j = await call({action:"load", code: load(CODE_KEY)});
  if (!j.ok){ if (j.error === "bad_code") signOut(); return; }
  let changed = false;
  if (j.state.rev !== state.rev){ state = j.state; store(CACHE_KEY, {role, state}); changed = true; }
  if (isAdmin() && profiles){
    const pj = await call({action:"profiles", code: load(CODE_KEY)});
    if (pj.ok && JSON.stringify(pj.profiles) !== JSON.stringify(profiles)){ profiles = pj.profiles; changed = true; }
  }
  if (changed && !document.querySelector("dialog[open]")) render();
}

/* ---------- Helpers ---------- */
const byId = id => state.people.find(p=>p.id===id);
const curRound = () => state.rounds.find(r=>r.id===round) || state.rounds[0];
const unplaced = r => { const a = state.assign[r.id] || {}; return state.people.filter(p=>!a[p.id] || !r.sessions.some(s=>s.id===a[p.id].s)); };
const sortPeople = (list, a) => list.sort((x,y)=>(a[y.id]?.f?1:0)-(a[x.id]?.f?1:0) || x.name.localeCompare(y.name));
function slotItem(rid){ for (const d of state.agenda) for (const it of d.items) if (it.round===rid) return {d, it}; return null; }
function slotWhen(rid){ const x = slotItem(rid); return x ? `${x.d.short}, ${x.it.start}` : ""; }
const mins = t => { const m=/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i.exec(t||""); if(!m) return 9999; let h=+m[1]%12; if((m[3]||"").toLowerCase()==="pm") h+=12; return h*60+(+m[2]||0); };
const subline = p => [p.title, p.org].filter(Boolean).join(", ");
// Lines starting with "-" become bullets; other lines are short paragraphs.
// A bullet like "Talk title (Presenter Name)" shows the presenter in bold under the title,
// and is highlighted when it's the attendee's own talk.
function bulletHTML(line, meName){
  const m = /^(.*\S)\s*\(([^()]+)\)\s*\)?\s*$/.exec(line);
  const isTalk = m && state.people.some(p=>norm(m[2]).includes(norm(p.name)));
  if (!isTalk) return `<li>${esc(line)}</li>`;
  const mine = meName && norm(m[2]).includes(meName);
  return `<li class="talk ${mine?"mytalk":""}"><span class="tt">${esc(m[1])}</span><b class="by">${esc(m[2])}</b>${mine?'<span class="you">You\'re presenting</span>':""}</li>`;
}
function descHTML(text, meName){
  const out = []; let list = [];
  const flush = () => { if (list.length){ out.push(`<ul>${list.map(l=>bulletHTML(l, meName)).join("")}</ul>`); list = []; } };
  String(text||"").split(/\r?\n/).forEach(line=>{
    const t = line.trim(); if (!t) return;
    if (/^[-*•]\s*/.test(t)) list.push(t.replace(/^[-*•]\s*/,""));
    else { flush(); out.push(`<p>${esc(t)}</p>`); }
  });
  flush();
  return out.length ? `<div class="desc">${out.join("")}</div>` : "";
}
function focusHTML(text){
  const lines = String(text||"").split(/\r?\n/).map(l=>l.replace(/^\s*[-*•]\s*/,"").trim()).filter(Boolean);
  if (!lines.length) return "";
  if (lines.length===1 && !/^\s*[-*•]/.test(text)) return `<span class="focus"><b>Focus areas</b>${esc(lines[0])}</span>`;
  return `<span class="focus"><b>Focus areas</b>${lines.map(l=>`<span class="fi">${esc(l)}</span>`).join("")}</span>`;
}
function detailsHTML(pr){
  const part = (label, text) => text ? `<span class="dl">${label}</span><span class="para">${esc(text)}</span>` : "";
  return `<span class="details">${part("Interviewee characteristics", pr.chars)}${part("Focus 1", pr.f1)}${part("Focus 2", pr.f2)}${part("Focus 3", pr.f3)}${part("Strong view", pr.view)}
    ${pr.tags.length?`<span class="tags">${pr.tags.map(tg=>`<button type="button" class="tagchip" data-tag="${esc(tg)}" aria-pressed="${tg===activeTag}">${esc(tg)}</button>`).join("")}</span>`:""}</span>`;
}

/* ---------- Render ---------- */
function render(){
  if (!state) return;
  const admin = isAdmin();
  // Header tools
  $("#adminTools").innerHTML = admin
    ? `<span class="role">Admin</span>${profiles && view==="board" ? ` <button type="button" class="switch" id="detBtn" aria-pressed="${showDetails}">Interview details: ${showDetails?"On":"Off"}</button>` : ""}`

/* ---------- Agenda (what attendees see) ---------- */
let open = new Set(), findText = "";
const firstName = n => String(n||"").split(/\s+/)[0];
function myBreakouts(){
  if (!me) return [];
  return state.rounds.map((r,i)=>{ const a = state.assign[r.id]?.[me]; const s = a && r.sessions.find(x=>x.id===a.s);
    return s ? {r, i, s, f:a.f, when: slotWhen(r.id)} : null; }).filter(Boolean);
}
// Funding Spotlights (or any "Title (Presenter)" bullet) this person is presenting.
function myTalks(){
  const meP = me && byId(me); if (!meP) return [];
  const meName = norm(meP.name), out = [];
  state.agenda.forEach(d=>d.items.forEach(it=>String(it.desc||"").split(/\r?\n/).forEach(line=>{
    const l = line.trim().replace(/^[-*•]\s*/,"");
    const m = /^(.*\S)\s*\(([^()]+)\)\s*\)?\s*$/.exec(l);
    if (m && norm(m[2]).includes(meName)) out.push({id: it.id, when: `${d.short}, ${it.start}`, block: it.title, title: m[1]});
  })));
  return out;
}
function findHTML(){
  const meP = me && byId(me);
  if (meP){
    const mine = myBreakouts(), talks = myTalks();
    return `<div class="findwrap"><div class="find found"><p class="hi">Hi, ${esc(firstName(meP.name))}!</p>
      <p class="lbl2">Your Breakout Groups</p>
      ${mine.length ? `<div class="mychips">${mine.map(m=>`<button type="button" class="mychip" data-jump="${m.s.id}"><span class="w">${esc(m.when||("Session "+(m.i+1)))}</span><span class="t">${esc(m.s.title)}</span>${m.f?'<span class="you">You\'re facilitating</span>':""}</button>`).join("")}</div>`
        : `<p class="lbl2">Your breakout groups haven't been assigned yet.</p>`}
      ${talks.length ? `<p class="lbl2" style="margin-top:14px">Your Funding Spotlight${talks.length>1?"s":""}</p><div class="mychips">${talks.map(k=>`<button type="button" class="mychip talkchip" data-jumpitem="${k.id}"><span class="w">${esc(k.when)}</span><span class="t">${esc(k.title)}</span><span class="you">You're presenting</span></button>`).join("")}</div>` : ""}
      <button type="button" class="linkbtn" id="notMe">Not ${esc(firstName(meP.name))}? Choose someone else</button></div></div>`;
  }
  const q = norm(findText).trim();
  const matches = q ? state.people.filter(p=>norm(p.name).split(/\s+/).some(w=>w.startsWith(q)) || norm(p.name).startsWith(q)).sort((a,b)=>a.name.localeCompare(b.name)).slice(0,6) : [];
  return `<div class="findwrap"><div class="find"><label for="findIn" class="hi">Your agenda</label>
    <p class="lbl2">Enter your name to view your personalized agenda.</p>
    <input id="findIn" type="search" autocomplete="off" placeholder="Start typing your name" value="${esc(findText)}">
    <div class="matches">${q && !matches.length ? `<p class="lbl2">No match yet. Try your first or last name.</p>` : matches.map(p=>`<button type="button" class="match" data-me="${p.id}"><b>${esc(p.name)}</b>${(p.org||p.title)?`<span>${esc(p.org||p.title)}</span>`:""}</button>`).join("")}</div></div></div>`;
}
function groupCard(r, s, asg, isMine){
  const ppl = sortPeople(state.people.filter(p=>asg[p.id]?.s===s.id), asg);
  const facs = ppl.filter(p=>asg[p.id].f).map(p=>p.name);
  const isOpen = open.has(s.id) || (isMine && !open.has("closed:"+s.id));
  return `<div class="group ${isMine?"mine":""} ${isOpen?"open":""}" id="bk-${s.id}">
    <button type="button" class="ghead" data-toggle="${s.id}" aria-expanded="${isOpen}">
      ${isMine?'<span class="here">Your group</span>':""}
      <span class="gt">${esc(s.title)}</span>
      <span class="gm">${ppl.length} ${ppl.length===1?"person":"people"}${facs.length?` · Facilitator: ${esc(facs.join(", "))}`:""}</span>
      <span class="chev" aria-hidden="true"></span></button>
    ${isOpen ? `<div class="gbody">${s.desc?`<p class="gdesc">${esc(s.desc)}</p>`:""}
      <ul class="people">${ppl.map(p=>`<li class="${p.id===me?"isme":""}"><span><b>${esc(p.name)}${p.id===me?" (you)":""}</b>${subline(p)?`<span class="sub">${esc(subline(p))}</span>`:""}</span>${asg[p.id].f?'<span class="fac">Facilitator</span>':""}</li>`).join("") || `<li class="lbl2">Participants to be announced.</li>`}</ul></div>` : ""}
  </div>`;
}
function renderAgenda(){
  const meP = me && byId(me), meName = meP ? norm(meP.name) : "";
  const talkIds = new Set(myTalks().map(k=>k.id));
  let h = findHTML();
  state.agenda.forEach(d=>{
    h += `<section class="day" id="day-${d.id}" aria-labelledby="h-${d.id}"><h2 id="h-${d.id}">${esc(d.label)}</h2>${d.theme?`<p class="q">${esc(d.theme)}</p>`:""}<ol class="items">`;
    [...d.items].sort((a,b)=>mins(a.start)-mins(b.start)).forEach(it=>{
      const minor = it.kind==="break" || it.kind==="meal";
      const r = it.round && state.rounds.find(x=>x.id===it.round);
      let extra = "", mine = false;
      if (r){
        const asg = state.assign[r.id] || {};
        const mySid = meP && asg[me]?.s;
        const myS = mySid && r.sessions.find(x=>x.id===mySid);
        const others = r.sessions.filter(x=>x!==myS);
        const showOthers = !myS || open.has("others:"+r.id);
        mine = !!myS;
        extra = `<div class="groups">${myS ? groupCard(r, myS, asg, true) : ""}
          ${myS ? `<button type="button" class="linkbtn more" data-others="${r.id}" aria-expanded="${showOthers}">${showOthers ? "Hide the other groups" : `See the other ${others.length} groups`}</button>` : ""}
          ${showOthers ? others.map(s=>groupCard(r, s, asg, false)).join("") : ""}</div>`;
      } else if (meName && norm(it.desc + " " + it.lead).includes(meName)){
        // If their talk is marked on its own line, don't repeat the badge for the whole block.
        mine = true; if (!talkIds.has(it.id)) extra = `<span class="you">You're presenting</span>`;
      }
      h += `<li class="item ${minor?"minor":""} ${r?"brk":""} ${mine?"me":""}" id="ag-${it.id}"><div class="t">${esc(it.start)}${it.end?"–"+esc(it.end):""}${it.room && !r?`<span class="loc">${esc(it.room)}</span>`:""}</div>
        <div class="c"><h3>${esc(it.title)}</h3>${descHTML(it.desc, meName)}${it.lead?`<p class="room">Led by ${esc(it.lead)}</p>`:""}${extra}</div></li>`;
    });
    h += `</ol></section>`;
  });
  $("#agendaView").innerHTML = h;
  const fi = $("#findIn");
  if (fi){ fi.oninput = e=>{ findText = e.target.value; const pos = e.target.selectionStart; renderAgenda(); const n = $("#findIn"); n.focus(); n.setSelectionRange(pos,pos); }; }
}

function card(p, a, inSession){
  const pr = profiles && profiles[p.id];
  const qHit = !query || [p.name,p.org,p.title,p.focus, pr?[pr.chars,pr.f1,pr.f2,pr.f3,pr.view,pr.tags.join(" ")].join(" "):""].join(" ").toLowerCase().includes(query);
  const tHit = !activeTag || (pr && pr.tags.includes(activeTag));
  const filtering = query || activeTag, hit = qHit && tHit, sub = subline(p);
  return `<li data-id="${p.id}"><div class="card ${filtering?(hit?"hit":"dim"):""}">
    <span class="who"><b>${esc(p.name)}</b>${sub?`<span class="org">${esc(sub)}</span>`:""}${a?.f?'<span class="fac">Facilitator</span>':""}${p.bio?`<span class="bio">${esc(p.bio)}</span>`:""}${focusHTML(p.focus)}${pr && showDetails ? detailsHTML(pr) : ""}</span>
    <span class="tools">${inSession?`<button type="button" class="star" data-star="${p.id}" aria-pressed="${!!a?.f}" aria-label="Mark ${esc(p.name)} as facilitator">${a?.f?"★":"☆"}</button>`:""}
    <button type="button" class="pen" data-person="${p.id}" aria-label="Edit ${esc(p.name)}">Edit</button></span></div></li>`;
}
function renderBoard(){
  if (!isAdmin()) { view = "agenda"; render(); return; }
  const R = curRound(); if (!R) { $("#sessions").innerHTML = "<p>No breakout sessions yet.</p>"; return; }
  round = R.id;
  const asg = state.assign[R.id] || (state.assign[R.id] = {});
  const admin = isAdmin();
  // Admin-only: issue tags from the interview details
  if (admin && profiles && showDetails){
    const counts = {}; Object.values(profiles).forEach(pr=>pr.tags.forEach(tg=>counts[tg]=(counts[tg]||0)+1));
    const tags = Object.keys(counts).sort((a,b)=>counts[b]-counts[a] || a.localeCompare(b));
    $("#tagbar").hidden = false;
    $("#tagbar").innerHTML = `<span class="lbl">Highlight by issue:</span>` + tags.map(tg=>`<button type="button" class="tagchip" data-tag="${esc(tg)}" aria-pressed="${tg===activeTag}">${esc(tg)} <small>${counts[tg]}</small></button>`).join("")
      + (activeTag?` <button type="button" class="btn quiet" id="clearTag" style="padding:3px 12px;font-size:13px">Clear</button>`:"");
  } else $("#tagbar").hidden = true;
  {
    const pool = sortPeople(unplaced(R), asg);
    $("#pool").innerHTML = pool.map(p=>card(p,null,false)).join("") || `<li class="empty">Everyone is assigned to a breakout in this slot.</li>`;
    $("#poolSub").textContent = pool.length ? "Drag people into a breakout." : "";
  }
  $("#sessions").innerHTML = R.sessions.map((s,i)=>{
    const ppl = sortPeople(state.people.filter(p=>asg[p.id]?.s===s.id), asg);
    return `<section class="col" id="sess-${s.id}" data-sid="${s.id}" aria-labelledby="h-${s.id}"><div class="col-head" style="--stripe:${STRIPES[i%STRIPES.length]}"${admin?' title="Drag the header to reorder sessions"':''}>${admin?'<span class="grip" aria-hidden="true">⋮⋮</span>':""}
      <h2 id="h-${s.id}">${esc(s.title)}</h2>${s.desc?`<p>${esc(s.desc)}</p>`:""}
      ${admin?`<button type="button" class="btn quiet" data-session-edit="${s.id}">Edit session</button>`:""}</div>
      <ul class="list" data-session="${s.id}">${ppl.map(p=>card(p,asg[p.id],true)).join("")}</ul></section>`;
  }).join("") + (admin ? `<button type="button" class="add-col" id="addSession">+ Add a session</button>` : "");
  bindDrag();
}

/* ---------- Drag and drop (admins only) ---------- */
function reorderSessions(ids){
  const R = curRound(), byIdS = Object.fromEntries(R.sessions.map(s=>[s.id,s]));
  const next = ids.map(id=>byIdS[id]).filter(Boolean);
  if (next.length !== R.sessions.length || next.every((s,i)=>s===R.sessions[i])) { render(); return; }
  R.sessions = next; render(); save(); toast("Session order saved");
}
function bindDrag(){
  sortables.forEach(s=>s.destroy()); sortables = [];
  if (!window.Sortable || !isAdmin()) return;
  sortables.push(Sortable.create($("#sessions"), {
    draggable:"section.col", handle:".col-head", filter:".btn", preventOnFilter:false,
    animation:150, delay:120, delayOnTouchOnly:true,
    onStart(){ dragging = true; },
    onEnd(){ dragging = false; reorderSessions([...$("#sessions").querySelectorAll("section.col")].map(el=>el.dataset.sid)); }
  }));
  document.querySelectorAll("#board .list").forEach(el=> sortables.push(Sortable.create(el, {
    group:"people", animation:150, draggable:"li[data-id]", filter:".star,.pen,.tagchip", preventOnFilter:false,
    delay:120, delayOnTouchOnly:true, ghostClass:"sortable-ghost",
    onStart(){ dragging = true; },
    onEnd(evt){ dragging = false;
      const id = evt.item.dataset.id, to = evt.to.dataset.session, asg = state.assign[round];
      if ((asg[id]?.s || "") === to){ render(); return; }
      if (to) asg[id] = {s:to, f:false}; else delete asg[id];
      render(); save();
      const s = curRound().sessions.find(x=>x.id===to);
      toast(`${byId(id).name} moved to ${s ? s.title : "Not yet placed"}`);
    }})));
}

/* ---------- Edit dialogs (admins only) ---------- */
const cancelBtn = `<button type="button" class="btn quiet" data-close>Cancel</button>`;
const EMPTY_PROFILE = {chars:"", f1:"", f2:"", f3:"", view:"", tags:[]};
const PROFILE_FIELDS = [["chars","pChars","Interviewee characteristics",60],["f1","pF1","Focus 1",60],["f2","pF2","Focus 2",70],["f3","pF3","Focus 3",70],["view","pView","Strong view",70]];
function profileFields(pr){
  pr = Object.assign({}, EMPTY_PROFILE, pr || {});
  return `<div class="details" style="margin-top:18px;padding:12px 14px">
    <span class="dl" style="font-size:14px">Interview details (admins only)</span>
    ${PROFILE_FIELDS.map(([k,id,label,h])=>`<label for="${id}">${label}</label><textarea id="${id}" style="min-height:${h}px">${esc(pr[k])}</textarea>`).join("")}
    <label for="pTags">Issue tags</label><input id="pTags" value="${esc(pr.tags.join("; "))}">
    <p class="hint">Separate tags with semicolons, for example: Collaboration; Scale; Locally led</p></div>`;
}
async function saveProfile(p){
  const next = {tags: $("#pTags").value.split(/[;\n]/).map(x=>x.trim()).filter(Boolean)};
  PROFILE_FIELDS.forEach(([k,id])=>{ next[k] = $("#"+id).value.trim(); });
  const prev = Object.assign({}, EMPTY_PROFILE, profiles[p.id] || {});
  const same = PROFILE_FIELDS.every(([k])=>(prev[k]||"")===next[k]) && JSON.stringify(prev.tags||[])===JSON.stringify(next.tags);
  if (same) return;
  profiles[p.id] = next; render();
  setStatus("Saving…");
  const j = await call({action:"saveProfile", code: load(CODE_KEY), person_id:p.id, person_name:p.name, profile:next});
  if (j.ok) setStatus("All changes saved");
  else { setStatus("Not saved"); toast("Couldn't save the interview details. Try again."); }
}
function openPerson(id){
  const p = byId(id);
  $("#personForm").innerHTML = `<h3>Edit ${esc(p.name)}</h3>
    <label for="fName">Name</label><input id="fName" value="${esc(p.name)}" required>
    <label for="fTitle">Title</label><input id="fTitle" value="${esc(p.title)}">
    <label for="fOrg">Organization</label><input id="fOrg" value="${esc(p.org)}">
    <label for="fBio">Short bio (admins only)</label><textarea id="fBio">${esc(p.bio)}</textarea>
    <label for="fFocus">Focus areas (admins only)</label><textarea id="fFocus" style="min-height:90px">${esc(p.focus||"")}</textarea>
    <p class="hint">Put each focus area on its own line to show them as bullet points.</p>
    ${profiles ? profileFields(profiles[p.id]) : ""}
    <div class="row">${cancelBtn}<button type="submit" class="btn solid">Save changes</button></div>`;
  $("#personForm").onsubmit = e=>{ e.preventDefault();
    p.name = $("#fName").value.trim() || p.name; p.title = $("#fTitle").value.trim(); p.org = $("#fOrg").value.trim(); p.bio = $("#fBio").value.trim(); p.focus = $("#fFocus").value.trim();
    if (profiles && $("#pChars")) saveProfile(p);
    $("#personDlg").close(); render(); save(); };
  $("#personDlg").showModal();
}
function openSession(sid){
  const R = curRound(), isNew = !sid;
  const s = isNew ? {id: R.id+"s"+Date.now().toString(36), title:"", desc:""} : R.sessions.find(x=>x.id===sid);
  $("#sessionForm").innerHTML = `<h3>${isNew?"Add a session":"Edit session"}</h3>
    <label for="sTitle">Title</label><input id="sTitle" value="${esc(s.title)}" required>
    <label for="sDesc">Description</label><textarea id="sDesc">${esc(s.desc)}</textarea>
    <div class="row">${isNew?"":`<button type="button" class="btn quiet danger left" id="delSession">Delete session</button>`}${cancelBtn}
    <button type="submit" class="btn solid">${isNew?"Add session":"Save changes"}</button></div>`;
  $("#sessionForm").onsubmit = e=>{ e.preventDefault();
    s.title = $("#sTitle").value.trim(); s.desc = $("#sDesc").value.trim(); if (isNew) R.sessions.push(s);
    $("#sessionDlg").close(); render(); save(); };
  if (!isNew) $("#delSession").onclick = ()=>{
    if (!confirm(`Delete "${s.title}"? Anyone in it moves to Not yet placed.`)) return;
    R.sessions = R.sessions.filter(x=>x.id!==s.id);
    const asg = state.assign[R.id]; Object.keys(asg).forEach(k=>{ if (asg[k].s===s.id) delete asg[k]; });
    $("#sessionDlg").close(); render(); save(); };
  $("#sessionDlg").showModal();
}

/* ---------- Clicks ---------- */
document.addEventListener("click", e=>{
  const t = e.target;
  if (t.closest("[data-close]")) { t.closest("dialog").close(); return; }
  if (t.closest("[data-view]")) { view = "agenda"; render(); window.scrollTo(0,0); return; }
  const go = t.closest("[data-round]");
  if (go){ round = go.dataset.round; view = "board"; render(); window.scrollTo(0,0); return; }
  const pick = t.closest("[data-me]");
  if (pick){ me = pick.dataset.me; store(ME_KEY, me); findText = ""; open = new Set(); renderAgenda(); $("#agendaView").scrollIntoView({block:"start"}); toast("Found you!"); return; }
  if (t.closest("#notMe")){ me = ""; store(ME_KEY, ""); findText = ""; renderAgenda(); setTimeout(()=>$("#findIn")?.focus(), 0); return; }
  const tog = t.closest("[data-toggle]");
  if (tog){ const id = tog.dataset.toggle, mineCard = tog.closest(".group.mine");
    if (mineCard){ open.has("closed:"+id) ? open.delete("closed:"+id) : open.add("closed:"+id); }
    else { open.has(id) ? open.delete(id) : open.add(id); }
    renderAgenda(); document.getElementById("bk-"+id)?.scrollIntoView({block:"nearest"}); return; }
  const oth = t.closest("[data-others]");
  if (oth){ const k = "others:"+oth.dataset.others; open.has(k) ? open.delete(k) : open.add(k); renderAgenda(); return; }
  const ji = t.closest("[data-jumpitem]");
  if (ji){ const el = document.getElementById("ag-"+ji.dataset.jumpitem); const mt = el && el.querySelector(".mytalk"); (mt||el)?.scrollIntoView({behavior:"smooth", block:"center"}); return; }
  const jump = t.closest("[data-jump]");
  if (jump){ document.getElementById("bk-"+jump.dataset.jump)?.scrollIntoView({behavior:"smooth", block:"center"}); return; }
  const dj = t.closest("[data-day]");
  if (dj){ document.getElementById("day-"+dj.dataset.day)?.scrollIntoView({behavior:"smooth", block:"start"}); return; }
  if (!isAdmin()) return;
  if (t.closest("#detBtn")) { showDetails = !showDetails; if (!showDetails) activeTag = ""; render(); return; }
  if (t.closest("#clearTag")) { activeTag = ""; render(); return; }
  const tg = t.closest("[data-tag]"); if (tg){ activeTag = activeTag===tg.dataset.tag ? "" : tg.dataset.tag; render(); return; }
  const st = t.closest("[data-star]"); if (st){ const a = state.assign[round][st.dataset.star]; if (a){ a.f = !a.f; render(); save(); } return; }
  const pe = t.closest("[data-person]"); if (pe){ openPerson(pe.dataset.person); return; }
  const se = t.closest("[data-session-edit]"); if (se){ openSession(se.dataset.sessionEdit); return; }
  if (t.closest("#addSession")) openSession(null);
});

/* ---------- Start ---------- */
(async()=>{
  me = load(ME_KEY);
  const code = load(CODE_KEY);
  if (!code){ $("#loading").hidden = true; showGate(""); return; }
  // Returning visitor: show the last saved version instantly, then check for updates.
  let cached = null; try { cached = JSON.parse(load(CACHE_KEY) || "null"); } catch(e){}
  if (cached && cached.state){ role = cached.role; showApp(cached.state); setStatus("Checking for updates…"); }
  const j = await call({action:"login", code});
  if (j.ok){ role = j.role; showApp(j.state); setStatus(""); if (isAdmin()) loadProfiles(); }
  else if (j.error === "bad_code"){ signOut(); $("#gateErr").textContent = "The code has changed. Enter the new code provided to you."; }
  else if (cached && cached.state) setStatus("Offline: showing the last saved version");
  else showGate(ERRORS[j.error] || "Something went wrong. Refresh the page to try again.");
  if (CONFIG.API_URL) setInterval(refresh, CONFIG.REFRESH_SECONDS*1000);
})();
</script>
</body>
</html>
