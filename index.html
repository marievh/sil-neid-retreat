<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NEID Global Retreat · Breakout Sessions</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23F4552A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap" rel="stylesheet">
<style>
:root{
  --orange:#F4552A; --teal:#007C7C; --deep:#0B3441; --yellow:#E4D22E;
  --bg:#FFFFFF; --panel:#F7EAE5; --card:#FFFFFF; --ink:#16282E; --muted:#56676C; --line:#E3D3CC; --col:#FBF5F2; --focus:#0B3441; --blush:#F7EAE5;
  --display:"Josefin Sans","Avenir Next","Century Gothic",system-ui,sans-serif;
  --body:"Nunito Sans","Avenir","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0A242D; --panel:#0F313C; --card:#123B47; --ink:#EEF3F2; --muted:#A9BCC0; --line:#24505C; --col:#0D2C36; --focus:#E4D22E; --blush:#2A3F45; }}
:root[data-theme="dark"]{ --bg:#0A242D; --panel:#0F313C; --card:#123B47; --ink:#EEF3F2; --muted:#A9BCC0; --line:#24505C; --col:#0D2C36; --focus:#E4D22E; --blush:#2A3F45; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.weave{height:18px;background:
  repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.35) 6px 8px),
  repeating-linear-gradient(90deg,var(--orange) 0 38px,var(--yellow) 38px 44px,var(--orange) 44px 70px,var(--teal) 70px 78px,var(--orange) 78px 120px,#F7EAE5 120px 124px)}
.btn{border:1.5px solid currentColor;background:transparent;border-radius:999px;padding:7px 16px;font-weight:700;cursor:pointer}
.btn.solid{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.quiet{border-color:var(--line)}
.btn:disabled{opacity:.6;cursor:default}

/* App */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px clamp(16px,4vw,40px)}
.top h1{margin:0;font:700 clamp(24px,3.5vw,32px)/1.1 var(--display);color:var(--orange)}
.top small{display:block;font:700 13px/1.2 var(--display);letter-spacing:.06em;color:var(--teal);margin-bottom:4px}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:12px}
.bar{background:var(--teal);display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px clamp(16px,4vw,40px)}
.tabs{display:flex;gap:8px;overflow-x:auto;max-width:100%}
.tab{border:0;border-radius:2px;background:#D8ECEB;color:var(--deep);padding:8px 16px;font:700 15px/1 var(--display);letter-spacing:.04em;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--yellow)}
.tab{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px 16px}
.tab .badge{margin-left:0;font-size:12px}
.badge{display:inline-block;margin-left:8px;min-width:22px;padding:2px 6px;border-radius:999px;background:var(--orange);color:#fff;font:700 12px/1.2 var(--body)}
.badge.done{background:var(--deep)}
.search{flex:1 1 200px;max-width:320px;margin-left:auto;border:0;border-radius:2px;padding:9px 12px;background:#fff;color:#16282E}
main{padding:20px clamp(16px,4vw,40px) 60px}
.loading{color:var(--muted);font-weight:600;margin:0 0 16px}
.rnote{margin:0 0 16px;font:700 16px/1.4 var(--display);color:var(--teal)}
.board{display:grid;grid-template-columns:minmax(260px,320px) 1fr;gap:20px;align-items:start}
.sessions{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.col{background:var(--col);border:1px solid var(--line);border-radius:4px;display:flex;flex-direction:column;min-width:0}
.col.pool{background:var(--panel);position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.col-head{padding:14px 14px 10px;border-top:6px solid var(--stripe,var(--teal));border-radius:4px 4px 0 0}
.col-head h2{margin:0;font:700 19px/1.2 var(--display);padding-right:28px}
.col:not(.pool) .col-head{position:relative;cursor:grab}
.grip{position:absolute;top:12px;right:12px;font-size:18px;line-height:1;color:var(--muted);letter-spacing:-2px;user-select:none}
.sessions .sortable-ghost{opacity:.4}
.col-head p{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.col-head .btn{margin-top:8px;font-size:13px;padding:4px 12px}
.list{list-style:none;margin:0;padding:6px 10px 12px;display:flex;flex-direction:column;gap:6px;min-height:64px;flex:1}
.empty{font-size:13px;color:var(--muted);padding:8px 4px;font-style:italic}
.add-col{border:2px dashed var(--line);border-radius:4px;background:transparent;min-height:120px;cursor:pointer;color:var(--muted);font-weight:700}
.card{display:flex;align-items:flex-start;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:9px 10px;cursor:grab}
.card.dim{opacity:.28} .card.hit{box-shadow:0 0 0 2px var(--orange)}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:700 14px/1 var(--display);border:3px solid var(--teal);background:var(--blush);padding-top:2px}
.who{min-width:0;flex:1}
.who b{display:block;font-size:14.5px;line-height:1.25}
.who .org{display:block;font-size:12.5px;font-weight:600;color:var(--teal)}
.who .bio{display:block;margin-top:4px;font-size:13px;line-height:1.45;color:var(--muted)}
.who .focus{display:block;margin-top:6px;font-size:12.5px;line-height:1.4;color:var(--ink)}
.who .focus b{display:block;font-size:12.5px;color:var(--teal)}
.who .fi{display:block;padding-left:14px;text-indent:-10px}
.who .fi::before{content:"•";display:inline-block;width:10px;text-indent:0;color:var(--teal)}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.fac{display:inline-block;margin-top:3px;font-size:11.5px;font-weight:700;background:var(--yellow);color:#16282E;border-radius:2px;padding:1px 6px}
.tools{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}
.star{border:0;background:transparent;font-size:18px;line-height:1;cursor:pointer;color:var(--muted);padding:4px}
.star[aria-pressed="true"]{color:var(--orange)}
.pen{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:12px;font-weight:700;padding:4px;text-decoration:underline}
.sortable-ghost{opacity:.35}
.details{display:block;margin-top:8px;padding:8px 10px;background:var(--blush);border-radius:3px;font-size:12.5px;line-height:1.45}
.details .dl{display:block;font-weight:700;color:var(--deep);margin-top:6px}
.details .dl:first-child{margin-top:0}
.details .para{display:block;white-space:pre-line}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tagchip{border:1px solid var(--teal);background:transparent;color:var(--teal);border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700;cursor:pointer}
.tagchip[aria-pressed="true"]{background:var(--teal);color:#fff}
.tagbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 16px}
.tagbar .lbl{font-weight:700;font-size:13.5px;margin-right:4px}
.tagbar .tagchip{font-size:12.5px;padding:3px 10px}
.tagbar .tagchip small{font-weight:600;opacity:.75}
.switch{border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;background:transparent;cursor:pointer;font-weight:700}
.switch[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:#fff}
.hintline{font-size:13.5px;color:var(--muted);margin:6px 0 0}
.errline{color:#B3261E;font-size:13.5px;min-height:1.4em;margin:8px 0 0}

dialog{border:0;border-radius:6px;padding:0;max-width:min(560px,calc(100vw - 32px));width:100%;background:var(--bg);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(11,52,65,.55)}
.dlg{padding:24px}
.dlg h3{margin:0 0 12px;font:700 24px/1.15 var(--display);color:var(--orange)}
.dlg label{display:block;font-weight:700;font-size:13px;margin:12px 0 4px}
.dlg input,.dlg textarea{width:100%;border:1px solid var(--line);border-radius:3px;padding:8px 10px;background:var(--card)}
.dlg textarea{min-height:110px;resize:vertical}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:20px}
.row .left{margin-right:auto}
.danger{color:#B3261E}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deep);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1}
@media (max-width:760px){ .board{grid-template-columns:1fr} .col.pool{position:static;max-height:none} .search{max-width:none;margin-left:0} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="weave" aria-hidden="true"></div>



<div id="app">
  <header class="top">
    <div><small>NEID Global Retreat</small><h1>Breakout Sessions</h1></div>
    <div class="status"><span id="saveStatus" aria-live="polite"></span><span id="planner"></span></div>
  </header>
  <nav class="bar" aria-label="Breakout slots">
    <div class="tabs" role="tablist" id="tabs"></div>
    <input class="search" id="search" type="search" placeholder="Search names, orgs, focus areas" aria-label="Find a person, organization, or focus area">
  </nav>
  <main>
    <div class="tagbar" id="tagbar" hidden></div>
    <p class="loading" id="loading">Loading the board… this can take a few seconds the first time.</p>
    <div class="board">
      <section class="col pool" aria-labelledby="poolH">
        <div class="col-head" style="--stripe:var(--yellow)"><h2 id="poolH">Not yet placed</h2><p id="poolSub"></p></div>
        <ul class="list" id="pool" data-session=""></ul>
      </section>
      <div class="sessions" id="sessions"></div>
    </div>
  </main>
</div>

<dialog id="personDlg"><form class="dlg" id="personForm"></form></dialog>
<dialog id="planDlg"><form class="dlg" id="planForm">
  <h3>Admin view</h3>
  <label for="planPw">Password</label><input id="planPw" type="password" autocomplete="current-password" required>
  <p class="errline" id="planErr" role="alert"></p>
  <div class="row"><button type="button" class="btn quiet" data-close>Cancel</button><button type="submit" class="btn solid" id="planGo">Login as Admin</button></div>
</form></dialog>
<dialog id="sessionDlg"><form class="dlg" id="sessionForm"></form></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
/* ---------- Config ----------
   Paste your Apps Script web app URL (ends in /exec) between the quotes.
   The board needs no sign-in. Interview details need the admin password,
   which lives in Apps Script (Script Properties), never in this file. */
const CONFIG = { API_URL: "https://script.google.com/macros/s/AKfycbyOLTmLxS4Dg1-HI7ot2e5oKh38WYtxrgSgp6OgfaqH9xbJw8CI_BP7ONZmswUu-vHn/exec", REFRESH_SECONDS: 30, DEMO_PASSWORD: "" };
const DEMO_PROFILES = null;   // preview only; the live site gets profiles from Apps Script
const SEED = null;
const CACHE_KEY = "neid-breakouts-cache", PLAN_KEY = "neid-planner-pw";
let profiles = null, showDetails = true, activeTag = "";
const getPlanPw = () => { try { return localStorage.getItem(PLAN_KEY) || ""; } catch(e){ return ""; } };
const setPlanPw = v => { try { v ? localStorage.setItem(PLAN_KEY, v) : localStorage.removeItem(PLAN_KEY); } catch(e){} };
const getCache = () => { try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch(e){ return null; } };
const setCache = s => { try { s ? localStorage.setItem(CACHE_KEY, JSON.stringify(s)) : localStorage.removeItem(CACHE_KEY); } catch(e){} };

const STRIPES = ["var(--orange)","var(--teal)","var(--yellow)","var(--deep)"];
let state = null, round = null, query = "", sortables = [], dragging = false, inFlight = 0, saving = Promise.resolve();
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials = n => n.split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase();
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }
function setStatus(t){ $("#saveStatus").textContent = t; }

/* ---------- Talking to the Google Sheet ---------- */
// Requests are POSTs sent as text/plain, which avoids a CORS preflight.
async function call(body){
  const ctrl = new AbortController(), timer = setTimeout(()=>ctrl.abort(), 25000);   // give up after 25 seconds
  let r;
  try { r = await fetch(CONFIG.API_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(body), signal: ctrl.signal}); }
  catch(e){ clearTimeout(timer); return {ok:false, error: e.name==="AbortError" ? "timeout" : "unreachable"}; }
  try { return await r.json(); } catch(e){ return {ok:false, error: e.name==="AbortError" ? "timeout" : "not_json"}; }
  finally { clearTimeout(timer); }
}
async function fetchState(){
  if (!CONFIG.API_URL) return SEED ? {ok:true, state: structuredClone(SEED)} : {ok:false, error:"no_url"};
  return call({action:"load"});
}
const LOAD_ERROR = {
  no_url: "This page isn't connected to the Google Sheet yet. Paste the Apps Script web app URL into API_URL in index.html.",
  unreachable: "Couldn't reach the Google Sheet. Check that API_URL in index.html is the web app URL ending in /exec, and that the Apps Script deployment's access is set to \"Anyone\".",
  not_json: "The Google Sheet didn't answer as expected. In Apps Script, check that you deployed a new version after the last code change.",
  timeout: "The Google Sheet took too long to respond. Refresh the page to try again."
};
const PLAN_ERRORS = {
  bad_password: "That password didn't match. Check for typos and try again.",
  no_password_set: "No admin password is set yet. In Apps Script, add ADMIN_PASSWORD under Project Settings > Script Properties.",
  unreachable: "Couldn't reach the Google Sheet. Check your connection and try again.",
  not_json: "The Google Sheet didn't answer as expected. In Apps Script, deploy a new version of the script.",
  timeout: "The Google Sheet took too long to respond. Try again in a minute."
};
async function fetchProfiles(pw){
  if (!CONFIG.API_URL) return (CONFIG.DEMO_PASSWORD && pw===CONFIG.DEMO_PASSWORD && DEMO_PROFILES) ? {ok:true, profiles: DEMO_PROFILES} : {ok:false, error:"bad_password"};
  return call({action:"profiles", password: pw});
}
async function unlock(pw){
  const j = await fetchProfiles(pw.trim());
  if (!j.ok) return j;
  setPlanPw(pw.trim()); profiles = j.profiles; showDetails = true; render(); return j;
}
function lock(){ setPlanPw(""); profiles = null; activeTag = ""; render(); }
function openPlanner(){ $("#planPw").value=""; $("#planErr").textContent=""; $("#planDlg").showModal(); }
$("#planForm").addEventListener("submit", async e=>{
  e.preventDefault();
  $("#planGo").disabled = true; $("#planErr").textContent = "Checking…";
  const j = await unlock($("#planPw").value);
  $("#planGo").disabled = false;
  if (!j.ok){ $("#planErr").textContent = PLAN_ERRORS[j.error] || "Something went wrong. Try again."; return; }
  $("#planDlg").close(); toast("Interview details are showing");
});
function save(){
  if (!CONFIG.API_URL) { setCache(state); return; }
  inFlight++; setStatus("Saving…");
  saving = saving.then(async ()=>{
    const j = await call({action:"save", rev: state.rev, state});
    if (j.ok){ state.rev = j.rev; setCache(state); setStatus("All changes saved"); }
    else if (j.conflict){ state = j.state; render(); setStatus("All changes saved"); toast("Someone else just made changes, so the board refreshed. Please redo your last change."); }
    else { setStatus("Not saved"); toast("Couldn't save. Check your connection and try again."); }
    inFlight--;
  });
}
async function refresh(){
  if (!CONFIG.API_URL || !state || document.hidden || dragging || inFlight || document.querySelector("dialog[open]")) return;
  const j = await call({action:"load"});
  let changed = false;
  if (j.ok && j.state.rev !== state.rev){ state = j.state; setCache(state); changed = true; }
  if (profiles && getPlanPw() && CONFIG.API_URL){
    const pj = await fetchProfiles(getPlanPw());
    if (pj.ok && JSON.stringify(pj.profiles) !== JSON.stringify(profiles)){ profiles = pj.profiles; changed = true; }
  }
  if (changed && !document.querySelector("dialog[open]")) render();
}

function showApp(s){
  state = s; setCache(s); if (!round || !s.rounds.some(r=>r.id===round)) round = s.rounds[0]?.id || null;
  $("#loading").hidden = true; render();
}

/* ---------- Board ---------- */
const curRound = () => state.rounds.find(r=>r.id===round) || state.rounds[0];
const byId = id => state.people.find(p=>p.id===id);
const unplaced = r => { const a = state.assign[r.id] || {}; return state.people.filter(p=>!a[p.id] || !r.sessions.some(s=>s.id===a[p.id].s)); };
const sortPeople = (list, a) => list.sort((x,y)=>(a[y.id]?.f?1:0)-(a[x.id]?.f?1:0) || x.name.localeCompare(y.name));

// One focus area per line. Leading "-", "*" or "•" is optional; several lines show as bullets.
function focusHTML(text){
  const lines = String(text||"").split(/\r?\n/).map(l=>l.replace(/^\s*[-*•]\s*/,"").trim()).filter(Boolean);
  if (!lines.length) return "";
  if (lines.length===1 && !/^\s*[-*•]/.test(text)) return `<span class="focus"><b>Focus areas</b>${esc(lines[0])}</span>`;
  return `<span class="focus"><b>Focus areas</b>${lines.map(l=>`<span class="fi">${esc(l)}</span>`).join("")}</span>`;
}
function detailsHTML(pr){
  const part = (label, text) => text ? `<span class="dl">${label}</span><span class="para">${esc(text)}</span>` : "";
  return `<span class="details">${part("Interviewee characteristics", pr.chars)}${part("Focus 1", pr.f1)}${part("Focus 2", pr.f2)}${part("Focus 3", pr.f3)}${part("Strong view", pr.view)}
    ${pr.tags.length?`<span class="tags">${pr.tags.map(tg=>`<button type="button" class="tagchip" data-tag="${esc(tg)}" aria-pressed="${tg===activeTag}">${esc(tg)}</button>`).join("")}</span>`:""}</span>`;
}
function card(p, a, inSession){
  const pr = profiles && profiles[p.id];
  const qHit = !query || [p.name,p.org,p.title,p.focus, pr?[pr.chars,pr.f1,pr.f2,pr.f3,pr.view,pr.tags.join(" ")].join(" "):""].join(" ").toLowerCase().includes(query);
  const tHit = !activeTag || (pr && pr.tags.includes(activeTag));
  const filtering = query || activeTag, hit = qHit && tHit;
  const sub = [p.title, p.org].filter(Boolean).join(", ");
  return `<li data-id="${p.id}"><div class="card ${filtering?(hit?"hit":"dim"):""}">
    <span class="av" aria-hidden="true">${esc(initials(p.name))}</span>
    <span class="who"><b>${esc(p.name)}</b>${sub?`<span class="org">${esc(sub)}</span>`:""}${a?.f?'<span class="fac">Facilitator</span>':""}${p.bio?`<span class="bio">${esc(p.bio)}</span>`:""}${focusHTML(p.focus)}${pr && showDetails ? detailsHTML(pr) : ""}</span>
    <span class="tools">${inSession?`<button type="button" class="star" data-star="${p.id}" aria-pressed="${!!a?.f}" aria-label="Mark ${esc(p.name)} as facilitator">${a?.f?"★":"☆"}</button>`:""}
    <button type="button" class="pen" data-person="${p.id}" aria-label="Edit ${esc(p.name)}">Edit</button></span></div></li>`;
}
function render(){
  if (!state) return;
  const R = curRound(); if (!R) { $("#sessions").innerHTML = "<p>No breakout slots yet. Add one in the Slots tab of the Google Sheet.</p>"; return; }
  round = R.id;
  $("#planner").innerHTML = profiles
    ? `<button type="button" class="switch" id="detBtn" aria-pressed="${showDetails}">Show interview details: ${showDetails?"On":"Off"}</button> <button type="button" class="btn quiet" id="lockBtn">Hide profile details and log out</button>`
    : `<button type="button" class="btn quiet" id="planBtn">Admin view</button>`;
  if (profiles && showDetails){
    const counts = {}; Object.values(profiles).forEach(pr=>pr.tags.forEach(tg=>counts[tg]=(counts[tg]||0)+1));
    const tags = Object.keys(counts).sort((a,b)=>counts[b]-counts[a] || a.localeCompare(b));
    $("#tagbar").hidden = false;
    $("#tagbar").innerHTML = `<span class="lbl">Highlight by issue:</span>` + tags.map(tg=>`<button type="button" class="tagchip" data-tag="${esc(tg)}" aria-pressed="${tg===activeTag}">${esc(tg)} <small>${counts[tg]}</small></button>`).join("")
      + (activeTag?` <button type="button" class="btn quiet" id="clearTag" style="padding:3px 12px;font-size:13px">Clear</button>`:"");
  } else { $("#tagbar").hidden = true; }
  const asg = state.assign[R.id] || (state.assign[R.id] = {});
  // Named by position, so they stay in order even if the agenda times move.
  $("#tabs").innerHTML = state.rounds.map((r,i)=>{ const n = unplaced(r).length;
    const left = n ? `${n} ${n===1?"person":"people"} to be assigned` : "Everyone assigned";
    return `<button type="button" class="tab" role="tab" aria-selected="${r.id===R.id}" data-round="${r.id}">Session ${i+1}<span class="badge ${n?"":"done"}">${left}</span></button>`; }).join("");
  const pool = sortPeople(unplaced(R), asg);
  $("#pool").innerHTML = pool.map(p=>card(p,null,false)).join("") || `<li class="empty">Everyone is assigned to a breakout in this slot.</li>`;
  $("#poolSub").textContent = pool.length ? "Drag people into a breakout." : "";
  $("#sessions").innerHTML = R.sessions.map((s,i)=>{
    const ppl = sortPeople(state.people.filter(p=>asg[p.id]?.s===s.id), asg);
    return `<section class="col" data-sid="${s.id}" aria-labelledby="h-${s.id}"><div class="col-head" style="--stripe:${STRIPES[i%STRIPES.length]}" title="Drag the header to reorder sessions"><span class="grip" aria-hidden="true">⋮⋮</span>
      <h2 id="h-${s.id}">${esc(s.title)}</h2>${s.desc?`<p>${esc(s.desc)}</p>`:""}
      <button type="button" class="btn quiet" data-session-edit="${s.id}">Edit session</button></div>
      <ul class="list" data-session="${s.id}">${ppl.map(p=>card(p,asg[p.id],true)).join("")}</ul></section>`;
  }).join("") + `<button type="button" class="add-col" id="addSession">+ Add a session</button>`;
  bindDrag();
}
// Put this slot's sessions in the order given (a list of session ids), then save.
function reorderSessions(ids){
  const R = curRound(), byIdS = Object.fromEntries(R.sessions.map(s=>[s.id,s]));
  const next = ids.map(id=>byIdS[id]).filter(Boolean);
  if (next.length !== R.sessions.length || next.every((s,i)=>s===R.sessions[i])) { render(); return; }
  R.sessions = next; render(); save(); toast("Session order saved");
}
function bindDrag(){
  sortables.forEach(s=>s.destroy()); sortables = [];
  if (!window.Sortable) return;
  // Sessions: drag a session by its header to reorder it within this slot.
  sortables.push(Sortable.create($("#sessions"), {
    draggable:"section.col", handle:".col-head", filter:".btn", preventOnFilter:false,
    animation:150, delay:120, delayOnTouchOnly:true,
    onStart(){ dragging = true; },
    onEnd(){ dragging = false; reorderSessions([...$("#sessions").querySelectorAll("section.col")].map(el=>el.dataset.sid)); }
  }));
  document.querySelectorAll(".list").forEach(el=> sortables.push(Sortable.create(el, {
    group:"people", animation:150, draggable:"li[data-id]", filter:".star,.pen,.tagchip", preventOnFilter:false,
    delay:120, delayOnTouchOnly:true, ghostClass:"sortable-ghost",
    onStart(){ dragging = true; },
    onEnd(evt){ dragging = false;
      const id = evt.item.dataset.id, to = evt.to.dataset.session, asg = state.assign[round];
      if ((asg[id]?.s || "") === to){ render(); return; }
      if (to) asg[id] = {s:to, f:false}; else delete asg[id];
      render(); save();
      const s = curRound().sessions.find(x=>x.id===to);
      toast(`${byId(id).name} moved to ${s ? s.title : "Not yet placed"}`);
    }})));
}

/* ---------- Edit dialogs ---------- */
const cancelBtn = `<button type="button" class="btn quiet" data-close>Cancel</button>`;
const EMPTY_PROFILE = {chars:"", f1:"", f2:"", f3:"", view:"", tags:[]};
const PROFILE_FIELDS = [["chars","pChars","Interviewee characteristics",60],["f1","pF1","Focus 1",60],["f2","pF2","Focus 2",70],["f3","pF3","Focus 3",70],["view","pView","Strong view",70]];
function plannerFields(pr){
  pr = Object.assign({}, EMPTY_PROFILE, pr || {});
  return `<div class="details" style="margin-top:18px;padding:12px 14px">
    <span class="dl" style="font-size:14px">Admin view</span>
    ${PROFILE_FIELDS.map(([k,id,label,h])=>`<label for="${id}">${label}</label><textarea id="${id}" style="min-height:${h}px">${esc(pr[k])}</textarea>`).join("")}
    <label for="pTags">Issue tags</label><input id="pTags" value="${esc(pr.tags.join("; "))}">
    <p class="hint">Separate tags with semicolons, for example: Collaboration; Scale; Locally led</p></div>`;
}
async function saveProfile(p){
  const next = {tags: $("#pTags").value.split(/[;\n]/).map(x=>x.trim()).filter(Boolean)};
  PROFILE_FIELDS.forEach(([k,id])=>{ next[k] = $("#"+id).value.trim(); });
  const prev = Object.assign({}, EMPTY_PROFILE, profiles[p.id] || {});
  const same = PROFILE_FIELDS.every(([k])=>(prev[k]||"")===next[k]) && JSON.stringify(prev.tags||[])===JSON.stringify(next.tags);
  if (same) return;
  profiles[p.id] = next; render();
  if (!CONFIG.API_URL) return;   // preview: kept in this page only
  setStatus("Saving…");
  const j = await call({action:"saveProfile", password:getPlanPw(), person_id:p.id, person_name:p.name, profile:next});
  if (j.ok) setStatus("All changes saved");
  else if (j.error==="bad_password"){ lock(); toast("The admin password changed. Open Admin View to sign in again."); }
  else { setStatus("Not saved"); toast("Couldn't save the admin view. Try again."); }
}
function openPerson(id){
  const p = byId(id);
  $("#personForm").innerHTML = `<h3>Edit ${esc(p.name)}</h3>
    <label for="fName">Name</label><input id="fName" value="${esc(p.name)}" required>
    <label for="fTitle">Title</label><input id="fTitle" value="${esc(p.title)}">
    <label for="fOrg">Organization</label><input id="fOrg" value="${esc(p.org)}">
    <label for="fBio">Short bio</label><textarea id="fBio">${esc(p.bio)}</textarea>
    <label for="fFocus">Focus areas</label><textarea id="fFocus" style="min-height:90px" placeholder="- Interested in independent funding&#10;- Women and girls&#10;- Haiti, but open to expanding in Latin America">${esc(p.focus||"")}</textarea>
    <p class="hint">Put each focus area on its own line to show them as bullet points.</p>
    ${profiles ? plannerFields(profiles[p.id]) : ""}
    <div class="row">${cancelBtn}<button type="submit" class="btn solid">Save changes</button></div>`;
  $("#personForm").onsubmit = e=>{ e.preventDefault();
    p.name = $("#fName").value.trim() || p.name; p.title = $("#fTitle").value.trim(); p.org = $("#fOrg").value.trim(); p.bio = $("#fBio").value.trim(); p.focus = $("#fFocus").value.trim();
    const hadPlanner = profiles && $("#pChars");
    if (hadPlanner) saveProfile(p);
    $("#personDlg").close(); render(); save(); };
  $("#personDlg").showModal();
}
function openSession(sid){
  const R = curRound(), isNew = !sid;
  const s = isNew ? {id: R.id+"s"+Date.now().toString(36), title:"", desc:""} : R.sessions.find(x=>x.id===sid);
  $("#sessionForm").innerHTML = `<h3>${isNew?"Add a session":"Edit session"}</h3>
    <label for="sTitle">Title</label><input id="sTitle" value="${esc(s.title)}" required>
    <label for="sDesc">Description</label><textarea id="sDesc">${esc(s.desc)}</textarea>
    <div class="row">${isNew?"":`<button type="button" class="btn quiet danger left" id="delSession">Delete session</button>`}${cancelBtn}
    <button type="submit" class="btn solid">${isNew?"Add session":"Save changes"}</button></div>`;
  $("#sessionForm").onsubmit = e=>{ e.preventDefault();
    s.title = $("#sTitle").value.trim(); s.desc = $("#sDesc").value.trim(); if (isNew) R.sessions.push(s);
    $("#sessionDlg").close(); render(); save(); };
  if (!isNew) $("#delSession").onclick = ()=>{
    if (!confirm(`Delete "${s.title}"? Anyone in it moves to Not yet placed.`)) return;
    R.sessions = R.sessions.filter(x=>x.id!==s.id);
    const asg = state.assign[R.id]; Object.keys(asg).forEach(k=>{ if (asg[k].s===s.id) delete asg[k]; });
    $("#sessionDlg").close(); render(); save(); };
  $("#sessionDlg").showModal();
}

/* ---------- Clicks ---------- */
document.addEventListener("click", e=>{
  const t = e.target;
  if (t.closest("[data-close]")) { t.closest("dialog").close(); return; }
  if (t.closest("#planBtn")) { openPlanner(); return; }
  if (t.closest("#lockBtn")) { lock(); toast("Logged out of admin view"); return; }
  if (t.closest("#detBtn")) { showDetails = !showDetails; if (!showDetails) activeTag = ""; render(); return; }
  if (t.closest("#clearTag")) { activeTag = ""; render(); return; }
  const tg = t.closest("[data-tag]"); if (tg){ activeTag = activeTag===tg.dataset.tag ? "" : tg.dataset.tag; render(); return; }
  const tab = t.closest("[data-round]"); if (tab){ round = tab.dataset.round; render(); return; }
  const st = t.closest("[data-star]"); if (st){ const a = state.assign[round][st.dataset.star]; if (a){ a.f = !a.f; render(); save(); } return; }
  const pe = t.closest("[data-person]"); if (pe){ openPerson(pe.dataset.person); return; }
  const se = t.closest("[data-session-edit]"); if (se){ openSession(se.dataset.sessionEdit); return; }
  if (t.closest("#addSession")) openSession(null);
});
$("#search").oninput = e=>{ query = e.target.value.trim().toLowerCase(); render(); };

/* ---------- Start ---------- */
(async()=>{
  const cached = getCache();
  if (cached){ showApp(cached); setStatus("Checking for updates…"); }   // last version on this device, shown instantly
  const j = await fetchState();
  if (j.ok){ showApp(j.state); setStatus(""); }
  else if (cached){ setStatus("Offline: showing the last saved version"); }
  else { $("#loading").textContent = LOAD_ERROR[j.error] || "Couldn't load the board. Refresh the page to try again."; }
  if (state && getPlanPw()){ const r = await unlock(getPlanPw()); if (!r.ok && r.error==="bad_password") setPlanPw(""); }
  if (CONFIG.API_URL) setInterval(refresh, CONFIG.REFRESH_SECONDS*1000);
})();
</script>
